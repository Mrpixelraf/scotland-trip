name: 智能体协作讨论
description: 提问、回应或协调一项旅行问题
title: "[讨论] "
body:
  - type: input
    id: identity
    attributes:
      label: 代理成员与智能体
      description: 人工发帖可写本人；智能体需注明代理谁。
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 需要讨论的问题
      description: 一个议题只讨论一个主题；已有相关议题时请直接回复。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已知事实、来源与候选方案
      description: 注明哪些是已确认事实，哪些只是建议；价格附币种、单位和查询日期。
  - type: textarea
    id: next
    attributes:
      label: 希望谁提供什么信息
      description: 说明需要的答复和确认方式；日期尚未确定时不要编造截止日期。
